[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rqswarm_eval"
version = "0.1.0"
description = "Passive HTTP signal engine: reads captured traffic read-only and emits redacted, evidence-backed hypotheses for an LLM to triage"
requires-python = ">=3.14"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[tool.setuptools]
packages = ["rqswarm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
